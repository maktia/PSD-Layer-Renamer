  /* ---------- 單一圖層重新命名 ---------- */

  function startEdit(key){
    var node = nodeOf(key);
    if (!node) return;
    // 在收合的資料夾裡就先展開，不然看不到輸入框
    var hidden = node.ancestors.some(function(a){ return S.collapsed[a]; });
    if (hidden){ node.ancestors.forEach(function(a){ delete S.collapsed[a]; }); render(); }

    var row = $("tree").querySelector('.row[data-key="' + key + '"]');
    if (!row) return;
    var nm = row.querySelector(".name");
    if (!nm) return;                      // 已經在編輯中
    var input = document.createElement("input");
    input.type = "text";
    input.className = "rename-input mono";
    input.value = nameOf(node);
    input.setAttribute("aria-label", t("aria.layername"));
    row.draggable = false;
    nm.parentNode.replaceChild(input, nm);
    row.scrollIntoView({ block:"nearest" });
    input.focus();
    input.select();

    var done = false;
    function finish(commit){
      if (done) return;
      done = true;
      var v = input.value;
      if (commit && v.trim().length && v !== nameOf(node)){
        pushHistory();
        writeName(node, v);
      }
      render();
    }

    input.addEventListener("keydown", function(ev){
      ev.stopPropagation();
      // 注音、倉頡等輸入法選字時按的 Enter 不算數
      if (ev.isComposing || ev.keyCode === 229) return;
      if (ev.key === "Enter"){ ev.preventDefault(); finish(true); }
      else if (ev.key === "Escape"){ ev.preventDefault(); finish(false); }
    });
    input.addEventListener("blur", function(){ finish(true); });
    ["click","mousedown","dblclick","dragstart"].forEach(function(t){
      input.addEventListener(t, function(ev){ ev.stopPropagation(); });
    });
  }

  document.addEventListener("keydown", function(ev){
    if (ev.key !== "F2" || !S.psd) return;
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    var keys = Object.keys(S.selected);
    if (keys.length !== 1) return;
    ev.preventDefault();
    startEdit(keys[0]);
  });

  /* ---------- 調整圖層順序 ---------- */

  function findParent(layer){
    var found = null;
    (function walk(node){
      if (found || !node.children) return;
      for (var i=0;i<node.children.length;i++){
        if (node.children[i] === layer){ found = node; return; }
        walk(node.children[i]);
      }
    })(S.psd);
    return found;
  }

  // 選到資料夾又選到它裡面的圖層時，只搬資料夾就好
  function topMovers(keys){
    return S.all.filter(function(n){
      if (!keys[n.key]) return false;
      for (var i=0;i<n.ancestors.length;i++){ if (keys[n.ancestors[i]]) return false; }
      return true;
    });
  }

  function nodeOf(key){
    for (var i=0;i<S.all.length;i++){ if (S.all[i].key === key) return S.all[i]; }
    return null;
  }

  // 不能把資料夾拖進自己或自己裡面
  function canDrop(keys, targetKey){
    var t = nodeOf(targetKey);
    if (!t || keys[targetKey]) return false;
    for (var i=0;i<t.ancestors.length;i++){ if (keys[t.ancestors[i]]) return false; }
    return true;
  }

  // where：before＝放到目標的上面，after＝下面，into＝放進資料夾最上面（都是指畫面上看到的方向）
  function moveLayers(keys, targetKey, where){
    if (!canDrop(keys, targetKey)) return;
    var movers = topMovers(keys).map(function(n){ return n.layer; });   // 畫面上由上到下
    if (!movers.length) return;
    var target = S.byKey[targetKey];
    pushHistory();

    movers.forEach(function(l){
      var par = findParent(l);
      if (par) par.children.splice(par.children.indexOf(l), 1);
    });

    // PSD 內部陣列是由下往上存；畫面若是翻過來顯示，插入時要反過來算
    var arr = S.reversed ? movers.slice().reverse() : movers.slice();

    if (where === "into"){
      if (!target.children) target.children = [];
      if (S.reversed) target.children.push.apply(target.children, arr);
      else target.children.unshift.apply(target.children, arr);
      delete S.collapsed[targetKey];
    } else {
      var par = findParent(target);
      var idx = par.children.indexOf(target);
      var at;
      if (where === "before") at = S.reversed ? idx + 1 : idx;
      else                    at = S.reversed ? idx : idx + 1;
      Array.prototype.splice.apply(par.children, [at, 0].concat(arr));
    }

    S.structureChanged = true;
    S.lastIndex = null;
    rebuild();
    requestComposite();
    say("msg.moved", { n:movers.length }, false);
  }

  // 上移／下移一格，只在同一個資料夾裡面移動
  function moveStep(dispDir){
    var movers = topMovers(S.selected);
    if (!movers.length) return;
    pushHistory();
    var arrDir = S.reversed ? -dispDir : dispDir;
    var groups = [];
    movers.forEach(function(n){
      var par = findParent(n.layer);
      var g = null;
      for (var i=0;i<groups.length;i++){ if (groups[i].par === par){ g = groups[i]; break; } }
      if (!g){ g = { par:par, items:[] }; groups.push(g); }
      g.items.push(n.layer);
    });
    var moved = 0;
    groups.forEach(function(g){
      var kids = g.par.children;
      var idxs = g.items.map(function(l){ return kids.indexOf(l); });
      idxs.sort(function(a,b){ return arrDir > 0 ? b - a : a - b; });   // 靠邊的先動，避免互相跳過
      var isMover = {};
      g.items.forEach(function(l){ isMover[l.__key] = true; });
      idxs.forEach(function(i){
        var j = i + arrDir;
        if (j < 0 || j >= kids.length || isMover[kids[j].__key]) return;
        var tmp = kids[i]; kids[i] = kids[j]; kids[j] = tmp;
        moved++;
      });
    });
    if (!moved){ S.history.pop(); return; }
    S.structureChanged = true;
    S.lastIndex = null;
    rebuild();
    requestComposite();
  }

  $("mvUp").addEventListener("click", function(){ moveStep(-1); });
  $("mvDn").addEventListener("click", function(){ moveStep(1); });

  /* 拖曳 */
  var drag = null;

  function clearDropMarks(){
    var marked = $("tree").querySelectorAll(".drop-before,.drop-after,.drop-into,.dragging");
    for (var i=0;i<marked.length;i++){
      marked[i].classList.remove("drop-before","drop-after","drop-into","dragging");
    }
  }

  function dropZone(row, ev){
    var r = row.getBoundingClientRect();
    var f = (ev.clientY - r.top) / r.height;
    var n = nodeOf(row.dataset.key);
    if (n && n.isGroup){
      if (f < 0.3) return "before";
      if (!S.collapsed[n.key]) return "into";      // 展開的資料夾：下半部就是放進去
      return f > 0.7 ? "after" : "into";
    }
    return f < 0.5 ? "before" : "after";
  }

  $("tree").addEventListener("dragstart", function(ev){
    var row = ev.target.closest && ev.target.closest(".row");
    if (!row) return;
    var key = row.dataset.key;
    var keys = {};
    if (S.selected[key]) Object.keys(S.selected).forEach(function(k){ keys[k] = true; });
    else keys[key] = true;
    drag = { keys:keys, zone:null, target:null };
    ev.dataTransfer.effectAllowed = "move";
    try{ ev.dataTransfer.setData("text/plain", key); }catch(e){}
    var rows = $("tree").querySelectorAll(".row");
    for (var i=0;i<rows.length;i++){ if (keys[rows[i].dataset.key]) rows[i].classList.add("dragging"); }
  });

  $("tree").addEventListener("dragover", function(ev){
    if (!drag) return;
    var row = ev.target.closest && ev.target.closest(".row");
    if (!row) return;
    var key = row.dataset.key;
    if (!canDrop(drag.keys, key)){ ev.dataTransfer.dropEffect = "none"; return; }
    ev.preventDefault();
    ev.dataTransfer.dropEffect = "move";
    var zone = dropZone(row, ev);
    if (drag.target === key && drag.zone === zone) return;
    var old = $("tree").querySelectorAll(".drop-before,.drop-after,.drop-into");
    for (var i=0;i<old.length;i++) old[i].classList.remove("drop-before","drop-after","drop-into");
    row.classList.add("drop-" + zone);
    drag.target = key; drag.zone = zone;
  });

  $("tree").addEventListener("drop", function(ev){
    if (!drag) return;
    ev.preventDefault();
    var d = drag; drag = null;
    clearDropMarks();
    if (d.target && d.zone) moveLayers(d.keys, d.target, d.zone);
  });

  $("tree").addEventListener("dragend", function(){
    drag = null;
    clearDropMarks();
  });

  /* ---------- 重複名稱檢查 ---------- */

  // 把所有圖層照「目前的名字」分組，同一個名字出現兩次以上就是重複
  function findDuplicates(){
    var withGroups = $("dupGroups").checked;
    var bucket = {};
    S.all.forEach(function(n){
      if (n.isGroup && !withGroups) return;
      if (S.deleted[n.key]) return;
      var name = nameOf(n);
      if (!bucket[name]) bucket[name] = [];
      bucket[name].push(n);
    });
    var keys = {}, groups = [];
    Object.keys(bucket).forEach(function(name){
      if (bucket[name].length > 1){
        groups.push({ name:name, nodes:bucket[name] });
        bucket[name].forEach(function(n){ keys[n.key] = true; });
      }
    });
    groups.sort(function(a,b){ return b.nodes.length - a.nodes.length; });
    return { keys:keys, groups:groups };
  }

  function nameOf(node){
    return S.renames[node.key] !== undefined
      ? S.renames[node.key]
      : (node.layer.name || "");
  }

  // 顯示成「資料夾／資料夾／圖層」好分辨是哪一個
  function pathOf(node){
    var parts = node.ancestors.map(function(k){
      var l = S.byKey[k];
      return l ? (l.name || "?") : "?";
    });
    parts.push(nameOf(node) || t("name.untitled"));
    return parts.join(" / ");
  }

  function renderDupPanel(dup){
    var box = $("dupbox");
    box.innerHTML = "";
    if (!dup.groups.length){
      box.innerHTML = '<div class="dupok">' + esc(t("dup.none")) + '</div>';
      return;
    }
    dup.groups.forEach(function(g){
      var wrap = document.createElement("div");
      wrap.className = "dupgroup";
      var t = document.createElement("div");
      t.className = "t mono";
      t.textContent = (g.name || tr("name.untitled")) + "  \u00D7" + g.nodes.length;
      wrap.appendChild(t);
      g.nodes.forEach(function(n){
        var b = document.createElement("button");
        b.className = "dupitem mono";
        b.textContent = pathOf(n);
        b.title = pathOf(n);
        b.addEventListener("click", function(){ navigateTo(n.key); });
        wrap.appendChild(b);
      });
      box.appendChild(wrap);
    });
  }

  // 點一下就跳到那一層：展開它所有的上層資料夾、選起來、捲到畫面中央
  function navigateTo(key){
    var node = null;
    for (var i=0;i<S.all.length;i++){ if (S.all[i].key === key){ node = S.all[i]; break; } }
    if (!node) return;
    node.ancestors.forEach(function(a){ delete S.collapsed[a]; });
    S.selected = {};
    S.selected[key] = true;
    S.lastIndex = null;
    render();
    var row = $("tree").querySelector('.row[data-key="' + key + '"]');
    if (row) row.scrollIntoView({ block:"center", behavior:"smooth" });
  }

  $("dupGroups").addEventListener("change", render);

  /* ---------- 左右標記與後綴 ---------- */

  // 取得這一層「目前」顯示的名字：改過就用新的，沒改過就用原本的
  function currentName(node){ return nameOf(node); }

  function writeName(node, out){
    if (out === (node.layer.name || "")) delete S.renames[node.key];
    else S.renames[node.key] = out;
  }

  function pushHistory(){
    S.history.push({ renames:JSON.parse(JSON.stringify(S.renames)), order:snapshotOrder() });
    if (S.history.length > 30) S.history.shift();
  }

  // 記下每個資料夾裡目前的排列（只記參照，很省記憶體）
  function snapshotOrder(){
    var snap = [];
    (function walk(node){
      if (!node.children) return;
      snap.push([node, node.children.slice()]);
      node.children.forEach(walk);
    })(S.psd);
    return snap;
  }

  // 勾選「加底線連接」時，後綴前面自動補一個底線
  function suffixToken(n){
    var v = $("sfx" + n).value;
    if (!v) return "";
    return ($("sfxConn").checked ? "_" : "") + v;
  }
  function suffixTokens(){
    return [suffixToken(1), suffixToken(2)].filter(function(x){ return x.length; });
  }

  // 把結尾的 _Mask / _Shdow 先剝下來收著，動完左右再黏回去
  function peelSuffix(name){
    var body = String(name), tail = "", moved = true;
    while (moved){
      moved = false;
      var toks = suffixTokens();
      for (var i=0;i<toks.length;i++){
        var tk = toks[i];
        if (body.length > tk.length && body.slice(-tk.length) === tk){
          tail = tk + tail;
          body = body.slice(0, -tk.length);
          moved = true;
        }
      }
    }
    return [body, tail];
  }

  // 把名字前後既有的左右標記拔掉，避免重複套用時愈疊愈長
  function stripSide(name){
    var v = String(name);
    var base = [$("ltext").value, $("rtext").value].filter(function(x){ return x && x.length; });
    // 有沒有勾選底線都認得，換了設定再套用一樣清得乾淨
    var custom = [];
    base.forEach(function(tk){ custom.push(tk + "_", "_" + tk, tk); });
    for (var i=0;i<custom.length;i++){
      var tk2 = custom[i];
      if (v.length > tk2.length && v.indexOf(tk2) === 0) v = v.slice(tk2.length);
      if (v.length > tk2.length && v.slice(-tk2.length) === tk2) v = v.slice(0, -tk2.length);
    }
    // 保險：四種常見寫法即使不在上面的欄位裡，也認得出來
    return v
      .replace(/^[LRlr]_/, "")
      .replace(/_[LRlr]$/, "")
      .replace(/^[\u5DE6\u53F3]_/, "")
      .replace(/_[\u5DE6\u53F3]$/, "");
  }

  function sideName(base, side){
    var tk = (side === "L") ? $("ltext").value : $("rtext").value;
    if (!tk) return base;
    var c = $("sideConn").checked ? "_" : "";
    return ($("sidepos").value === "pre") ? (tk + c + base) : (base + c + tk);
  }

  // 先把標記記下來（不動名字），全部標完再一次套用
  function markSide(side){
    var sel = selectedNodes();
    if (!sel.length) return;
    sel.forEach(function(node){ S.sideMark[node.key] = side; });
    render();
  }

  function sideCounts(){
    var L = 0, R = 0;
    Object.keys(S.sideMark).forEach(function(k){ S.sideMark[k] === "L" ? L++ : R++; });
    return { L:L, R:R, total:L + R };
  }

  function refreshQueue(){
    var c = sideCounts();
    var info = $("queueInfo");
    $("applySide").disabled = c.total === 0;
    if (!c.total){
      info.textContent = t("queue.idle");
      return;
    }
    info.innerHTML = t("queue.pending", { l:c.L, r:c.R });
  }

  function applySide(){
    var keys = Object.keys(S.sideMark);
    if (!keys.length) return;
    pushHistory();
    var done = 0;
    S.all.forEach(function(node){
      var side = S.sideMark[node.key];
      if (!side) return;
      var parts = peelSuffix(currentName(node));
      writeName(node, sideName(stripSide(parts[0]), side) + parts[1]);
      done++;
    });
    S.sideMark = {};
    render();
    say("msg.sideApplied", { n:done }, false);
  }

  function toggleSuffix(tk){
    var sel = selectedNodes();
    if (!sel.length || !tk) return;
    pushHistory();
    sel.forEach(function(node){
      var cur = currentName(node);
      var has = cur.length > tk.length && cur.slice(-tk.length) === tk;
      writeName(node, has ? cur.slice(0, -tk.length) : cur + tk);
    });
    render();
  }

  $("addL").addEventListener("click", function(){ markSide("L"); });
  $("addR").addEventListener("click", function(){ markSide("R"); });
  $("applySide").addEventListener("click", applySide);
  $("btnSfx1").addEventListener("click", function(){ toggleSuffix(suffixToken(1)); });
  $("btnSfx2").addEventListener("click", function(){ toggleSuffix(suffixToken(2)); });

  $("stripSide").addEventListener("click", function(){
    var sel = selectedNodes();
    if (!sel.length) return;
    pushHistory();
    sel.forEach(function(node){
      delete S.sideMark[node.key];               // 連還沒套用的標記一起取消
      var parts = peelSuffix(currentName(node));
      writeName(node, stripSide(parts[0]) + parts[1]);
    });
    render();
  });

  function syncSideUI(){
    var w = t("eg.word"), sep = t("eg.sep");
    $("sideEg").textContent = t("eg.prefix") + sideName(w, "L") + sep + sideName(w, "R");
    var t1 = suffixToken(1), t2 = suffixToken(2);
    $("sfxEg").textContent = t("eg.prefix") + w + (t1 || "") + sep + w + (t2 || "");
  }
  ["ltext","rtext","sidepos","sideConn","sfx1","sfx2","sfxConn"].forEach(function(id){
    $(id).addEventListener("input", syncSideUI);
    $(id).addEventListener("change", function(){ syncSideUI(); render(); });
  });
  syncSideUI();

  /* ---------- 啟動 ---------- */

  setLang(LANG);

  /* ---------- 匯出 ---------- */

  $("export").addEventListener("click", function(){
    if (!S.psd){ say("msg.needFile", true); return; }
    var btn = this;
    btn.disabled = true;
    btn.textContent = t("msg.building");
    var restore = function(){ btn.disabled = false; btn.textContent = t("btn.export"); };
    try{
      var blob = PSDLite.build(S.doc, S.psd, {
        isDeleted: function(l){ return !!S.deleted[l.__key]; },
        nameOf: function(l){ return S.renames[l.__key] !== undefined ? S.renames[l.__key] : l.name; },
        structureChanged: S.structureChanged || Object.keys(S.deleted).length > 0
      });
      var stem = S.fileName.replace(/\.(psd|psb)$/i, "");
      var ext = S.doc.psb ? ".psb" : ".psd";
      if (window.claude && window.claude.use){
        say("msg.packing", false);
        PSDLite.zipStore(stem + "_renamed" + ext, blob, function(p){
          $("status").textContent = t("msg.packingPct", { p:Math.round(p * 100) });
        }).then(function(zip){
          offerDownload(stem + "_renamed.zip", zip);
          restore();
        }).catch(function(err){ say("msg.exportFail", { msg:errText(err) }, true); restore(); });
      } else {
        fallbackDownload(stem + "_renamed" + ext, blob);
        restore();
      }
    }catch(err){
      console.error(err);
      say("msg.exportFail", { msg:errText(err) }, true);
      restore();
    }
  });

  function offerDownload(filename, blob){
    window.claude.use("downloads").then(function(d){
      if (!d){ fallbackDownload(filename, blob); return; }
      d.save({ filename:filename, data:blob }).then(function(){
        say("msg.downloaded", { name:filename }, false);
      }).catch(function(e){
        if (e && e.code === "declined") say("msg.cancelled", false);
        else say("msg.tooBig", true);
      });
    }).catch(function(){ fallbackDownload(filename, blob); });
  }

  function fallbackDownload(filename, blob){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    say("msg.saved", { name:filename }, false);
  }

  // 收翻譯鍵而不是現成文字，這樣切語言時能把上一則訊息一起換掉
  function say(key, vars, bad){
    if (typeof vars === "boolean"){ bad = vars; vars = null; }
    S.lastSay = { key:key, vars:vars, bad:bad };
    var el = $("status");
    el.textContent = t(key, vars);
    el.className = "status show " + (bad ? "bad" : "ok");
  }

  function resay(){
    if (!S.lastSay) return;
    $("status").textContent = t(S.lastSay.key, S.lastSay.vars);
  }

})();
</script>
</body>
</html>
