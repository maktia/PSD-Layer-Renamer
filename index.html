<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSD 圖層流水號命名台</title>
<style>
  /* ---------- 色彩：深色（預設） ---------- */
  :root{
    --app:#1E1E1E; --ws:#191919; --panel:#2B2B2B; --head:#232323; --field:#1C1C1C; --raised:#3A3A3A;
    --line:#121212; --soft:#353535; --text:#E4E4E4; --dim:#A3A3A3; --hi:rgba(255,255,255,.07); --folder:#6E6E6E;
    --accent:#F59E85; --accent-edge:#B07260; --on-accent:#161616; --sel:rgba(245,158,133,.26);
    --warn-bg:rgba(255,99,88,.16); --warn-text:#FF9A90; --warn-edge:rgba(255,99,88,.45);
    --ok-text:#9FD8A8;
    --rad:2px; --shadow-blur:1px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:dark;
  }
  :root[data-theme="mid"]{
    --app:#3C3C3C; --ws:#333333; --panel:#4A4A4A; --head:#424242; --field:#383838; --raised:#5A5A5A;
    --line:#262626; --soft:#555555; --text:#F0F0F0; --dim:#C2C2C2; --hi:rgba(255,255,255,.08); --folder:#8A8A8A;
    --sel:rgba(245,158,133,.30);
    --warn-bg:rgba(255,99,88,.20); --warn-text:#FFB0A8; --warn-edge:rgba(255,99,88,.5);
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --app:#C8C8C8; --ws:#B4B4B4; --panel:#E4E4E4; --head:#D4D4D4; --field:#FFFFFF; --raised:#F2F2F2;
    --line:#9E9E9E; --soft:#CECECE; --text:#1E1E1E; --dim:#555555; --hi:rgba(255,255,255,.9); --folder:#F2F2F2;
    --sel:rgba(245,158,133,.38);
    --warn-bg:rgba(200,40,30,.10); --warn-text:#A8231A; --warn-edge:rgba(200,40,30,.4);
    --ok-text:#2E6B3A;
    color-scheme:light;
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--app)}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    color:var(--text);
    font-family:'IBM Plex Sans','Noto Sans TC','Microsoft JhengHei',sans-serif;
    font-size:13px;line-height:1.4;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .mono{font-family:'JetBrains Mono','Noto Sans TC',ui-monospace,Consolas,monospace}
  .cjk{font-family:'Noto Sans TC','IBM Plex Sans','Microsoft JhengHei',sans-serif}
  [hidden]{display:none !important}

  /* ---------- 控制項 ---------- */
  button{
    font:inherit;color:var(--text);cursor:pointer;
    height:28px;padding:0 10px;
    background:var(--raised);border:1px solid var(--line);border-radius:var(--rad);
    box-shadow:inset 0 1px 0 var(--hi),0 1px var(--shadow-blur) rgba(0,0,0,.45);
    white-space:nowrap;
  }
  button:hover:not(:disabled){filter:brightness(1.12)}
  button:active:not(:disabled){box-shadow:inset 0 1px 2px rgba(0,0,0,.35);transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{
    background:var(--accent);color:var(--on-accent);border-color:var(--accent-edge);font-weight:700;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px var(--shadow-blur) rgba(0,0,0,.45);
  }
  button.tiny{height:22px;padding:0 7px;font-size:11.5px}
  button.icon{width:28px;padding:0;display:inline-flex;align-items:center;justify-content:center}
  button.icon svg{width:14px;height:14px;display:block}

  input[type=text],input[type=number],select{
    font:inherit;font-size:13px;color:var(--text);
    height:28px;padding:0 8px;width:100%;
    background:var(--field);border:1px solid var(--line);border-radius:var(--rad);
  }
  select{padding:0 4px;font-size:12px}
  input:focus,select:focus{outline:1px solid var(--accent);outline-offset:0;border-color:var(--accent)}
  input::placeholder{color:var(--dim);opacity:.7}
  input[type=checkbox]{width:14px;height:14px;margin:0;accent-color:var(--accent)}
  label{color:var(--dim);font-size:12px}
  .chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--text)}
  .vr{width:1px;height:20px;background:var(--line);flex:none}
  .vr.soft{background:var(--soft);height:16px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- 版面 ---------- */
  .app{height:100%;display:flex;flex-direction:column;min-width:0}

  .topbar{
    height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;
    background:var(--head);border-bottom:1px solid var(--line);
  }
  .topbar .title{font-family:'Noto Sans TC',sans-serif;font-weight:700;letter-spacing:.02em;white-space:nowrap}
  .badge{flex:none;height:18px;padding:0 7px;display:flex;align-items:center;border-radius:var(--rad);
         font-size:11px;font-weight:700;background:var(--soft);color:var(--dim);white-space:nowrap}
  .badge.free{background:var(--accent);color:var(--on-accent)}
  .upsell{flex:none;height:24px;padding:0 10px;display:inline-flex;align-items:center;gap:5px;
          background:var(--accent);color:var(--on-accent);border:1px solid var(--accent-edge);border-radius:var(--rad);
          font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
  .upsell:hover{filter:brightness(1.1)}
  .limits{margin:0 0 12px;font-size:12px;color:var(--dim)}
  .topbar #hint{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .topbar .spacer{margin-left:auto}
  .chip{
    display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;flex:none;
    border:1px solid var(--soft);border-radius:var(--rad);color:var(--dim);font-size:12px;white-space:nowrap;
  }
  .chip svg{width:12px;height:12px}
  .topbar select{width:auto;height:24px}

  .board{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px 340px}

  /* 工作區 */
  .work{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
  .optbar{
    height:36px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--line);
  }
  .optbar select{width:auto;height:24px}
  .optbar .tip{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabstrip{height:28px;flex:none;display:flex;align-items:flex-end;padding:0 8px;background:var(--head);border-bottom:1px solid var(--line)}
  .doctab{
    height:27px;display:flex;align-items:center;padding:0 14px;max-width:100%;
    background:var(--ws);border:1px solid var(--line);border-bottom:none;border-radius:var(--rad) var(--rad) 0 0;
    font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .canvasArea{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:var(--ws);overflow:hidden}
  .stage{position:relative;cursor:crosshair;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.45)}
  .stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  .stage.bg-checker{background-color:#fff;
    background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),
                     linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%);
    background-size:12px 12px;background-position:0 0,6px 6px}
  .stage.bg-white{background:#fff}
  .stage.bg-gray{background:#7f7f7f}
  .stage.bg-black{background:#000}
  .empty{text-align:center;color:var(--dim);max-width:360px;padding:24px;line-height:1.7}
  .empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:6px;font-family:'Noto Sans TC',sans-serif}
  .empty p{margin:0 0 14px;font-size:12.5px}
  .errbox{margin-top:6px;padding:10px 12px;text-align:left;background:var(--warn-bg);border:1px solid var(--warn-edge);border-radius:var(--rad);display:flex;flex-direction:column;gap:6px;color:var(--text)}
  .errbox b{color:var(--warn-text)}
  .errbox code{font-family:'JetBrains Mono',monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;user-select:all}
  .errbox span{font-size:11.5px;color:var(--dim)}
  .busy{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.45);color:#fff;font-size:13px;z-index:2;
  }
  .busy.show{display:flex}
  .statusbar{
    height:24px;flex:none;display:flex;align-items:center;gap:16px;padding:0 12px;
    background:var(--head);border-top:1px solid var(--line);font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;
  }
  .statusbar .right{margin-left:auto;overflow:hidden;text-overflow:ellipsis}
  .status{display:none}
  .status.show{display:inline}
  .status.ok{color:var(--ok-text)}
  .status.bad{color:var(--warn-text)}

  /* 面板共用 */
  .panel{background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .ptitle{
    height:28px;flex:none;display:flex;align-items:center;padding:0 10px;
    background:var(--head);border-bottom:1px solid var(--line);
  }
  .ptitle h2{margin:0;font-size:12px;font-weight:600;font-family:'Noto Sans TC',sans-serif}
  .ptitle svg{margin-left:auto;width:14px;height:14px}
  .pbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}

  /* 圖層面板 */
  .layers{border-right:1px solid var(--line)}
  .ltools{flex:none;display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .ltools button{height:26px;font-size:12px;padding:0 7px}
  .ltools button.icon{width:28px;padding:0}
  .ltools .push{margin-left:auto}
  #tree{flex:1;min-height:0;overflow:auto;font-family:'Noto Sans TC','IBM Plex Sans',sans-serif}
  .lfoot{flex:none;height:26px;display:flex;align-items:center;padding:0 10px;background:var(--head);border-top:1px solid var(--line);font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tree-empty{padding:18px 14px;color:var(--dim);font-size:12px;line-height:1.7}

  .row{display:flex;align-items:center;height:44px;border-bottom:1px solid var(--soft);cursor:default;user-select:none;position:relative}
  .row:not(.sel):hover{background:rgba(255,255,255,.035)}
  :root[data-theme="light"] .row:not(.sel):hover{background:rgba(0,0,0,.04)}
  .row.sel{background:var(--sel)}
  .row .eye{
    width:28px;height:44px;flex:none;padding:0;display:flex;align-items:center;justify-content:center;
    background:transparent;border:none;border-right:1px solid var(--soft);border-radius:0;box-shadow:none;color:var(--text);
  }
  .row .eye svg{width:15px;height:15px;display:block}
  .row .eye:active{transform:none}
  .row .pen{width:22px;flex:none;display:flex;justify-content:center;color:var(--text)}
  .row .pen svg{width:12px;height:12px}
  .row .indent{flex:none}
  .row .twist{width:16px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--dim);cursor:pointer;height:44px}
  .row .twist svg{width:10px;height:10px}
  .row .thumb{
    width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
    box-shadow:0 0 0 1px var(--line);
    background-color:#fff;
    background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),
                     linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%);
    background-size:6px 6px;background-position:0 0,3px 3px;
  }
  .row.sel .thumb{box-shadow:0 0 0 2px var(--accent)}
  .row .thumb img{max-width:100%;max-height:100%;display:block}
  .row .thumb.folder{background:none;box-shadow:none}
  .row .thumb.folder svg{width:34px;height:28px}
  .row .thumb.clip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .row .label{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:8px;line-height:1.3}
  .row .meta{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .name .old{color:var(--dim);text-decoration:line-through;margin-right:6px}
  .row .name .old::after{content:"→";display:inline-block;margin-left:6px;text-decoration:none;color:var(--dim)}
  .row .name .new{font-weight:700}
  .row.group .name{font-weight:500}
  .row.off .thumb,.row.off .label{opacity:.45}
  .row.gone .name{text-decoration:line-through;color:var(--dim)}
  .row.gone .thumb{opacity:.35}
  .row .tag{
    flex:none;margin-right:8px;height:18px;padding:0 6px;display:flex;align-items:center;
    background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-edge);border-radius:var(--rad);
    font-size:11px;font-weight:700;font-family:'Noto Sans TC',sans-serif;
  }
  .row .acts{flex:none;margin-right:8px;display:none}
  .row:hover .acts{display:block}
  .row input.rename-input{height:22px;font-size:13px;padding:0 6px;width:100%}
  .row.dragging{opacity:.45}
  .row.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
  .row.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
  .row.drop-into{background:var(--sel);outline:1px dashed var(--accent);outline-offset:-2px}

  /* 右側停駐區 */
  .dock{display:flex;flex-direction:column;gap:1px;background:var(--line);min-height:0;overflow-y:auto;font-family:'Noto Sans TC','IBM Plex Sans',sans-serif}
  .dock .panel{flex:none}
  .dock .panel.grow{flex:1 0 auto}
  .form{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:8px}
  .duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .stack{display:flex;flex-direction:column;gap:3px}
  .stack label{font-size:11px}
  .sfx{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:6px}
  .sfx input{font-family:'JetBrains Mono',monospace;font-size:12px}
  .divider{height:1px;background:var(--soft)}
  .eg{margin:0;font-size:11px;color:var(--dim)}
  .queue{display:flex;align-items:center;gap:8px}
  .queue .n{flex:1;min-width:0;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .queue .n b{color:var(--accent);font-weight:700}
  .queue button{height:26px;font-size:12px}
  .row .mark{
    flex:none;margin-right:8px;height:18px;padding:0 6px;display:flex;align-items:center;
    background:var(--accent);color:var(--on-accent);border-radius:var(--rad);
    font-size:11px;font-weight:700;font-family:'Noto Sans TC',sans-serif;
  }
  .eg b{font-family:'JetBrains Mono','Noto Sans TC',monospace;font-weight:500;color:var(--text)}
  .sub{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sub .t{font-size:12px;font-weight:600;color:var(--text)}
  .sub .chk{font-size:11px;color:var(--dim)}
  .sub + .sub{margin-top:4px}

  .preview{
    padding:6px 8px;background:var(--field);border:1px solid var(--line);border-radius:var(--rad);
    font-family:'JetBrains Mono','Noto Sans TC',monospace;font-size:12px;line-height:1.7;color:var(--dim);
    max-height:120px;overflow:auto;
  }
  .preview b{color:var(--text);font-weight:700}
  .preview .empty-t{color:var(--dim)}

  .dupbox{max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .dupok{color:var(--dim);font-size:12px}
  .dupgroup{background:var(--field);border:1px solid var(--line);border-radius:var(--rad);display:flex;flex-direction:column}
  .dupgroup .t{height:24px;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--soft);font-size:12px;font-weight:700;color:var(--warn-text)}
  .dupitem{
    height:26px;padding:0 8px 0 18px;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--soft);
    border-radius:0;box-shadow:none;font-family:'JetBrains Mono','Noto Sans TC',monospace;font-size:12px;
    overflow:hidden;text-overflow:ellipsis;
  }
  .dupitem:last-child{border-bottom:none}
  .dupitem:hover{background:var(--sel);filter:none}
  .dupitem:active{transform:none}
  .emptyrow{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:6px}
  .emptyrow .p{
    height:26px;padding:0 8px;text-align:left;background:var(--field);color:var(--dim);box-shadow:none;
    font-family:'JetBrains Mono','Noto Sans TC',monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;
  }
  .emptyrow .tiny{height:26px}

  /* 窄螢幕：改成上下排列 */
  @media (max-width:1100px){
    body{overflow:auto}
    .app{height:auto;min-height:100%}
    .topbar{height:auto;flex-wrap:wrap;padding:8px 12px;row-gap:8px}
    .board{display:flex;flex-direction:column}
    .work{border-right:none;border-bottom:1px solid var(--line)}
    .canvasArea{height:62vh;flex:none}
    .layers{border-right:none;border-bottom:1px solid var(--line)}
    #tree{max-height:60vh;flex:none}
    .dock{overflow:visible}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- 頂端工具列 -->
  <header class="topbar">
    <span class="title" data-i18n="app.title">PSD 圖層流水號命名台</span>
    <span class="badge" id="edition"></span>
    <a class="upsell" id="upsell" href="#" target="_blank" rel="noopener" hidden></a>
    <span class="vr"></span>
    <button class="primary" id="pick" data-i18n="btn.open">開啟 PSD 檔案</button>
    <input type="file" id="file" accept=".psd,.psb" hidden>
    <span id="hint" class="mono">尚未開啟檔案</span>
    <span class="chip spacer" data-i18n-title="chip.offline.title" title="所有處理都在這個瀏覽器分頁裡完成">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="7" width="10" height="7"></rect><path d="M5 7V5a3 3 0 0 1 6 0v2"></path></svg>
      <span data-i18n="chip.offline">離線處理・不上傳</span>
    </span>
    <label for="lang" class="sr" data-i18n="label.lang">語言</label>
    <select id="lang" data-i18n-title="label.lang" title="語言">
      <option value="zh">繁體中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
    <label for="theme" class="sr" data-i18n="label.theme">介面亮度</label>
    <select id="theme" data-i18n-title="label.theme" title="介面亮度">
      <option value="dark" data-i18n="theme.dark">深色</option>
      <option value="mid" data-i18n="theme.mid">中灰</option>
      <option value="light" data-i18n="theme.light">淺色</option>
    </select>
    <span class="vr"></span>
    <button id="undo" disabled data-i18n="btn.undo">復原上一步</button>
    <button id="reset" disabled data-i18n="btn.reset">清除所有改名</button>
    <button class="primary" id="export" data-i18n="btn.export">匯出改名後的 PSD</button>
  </header>

  <div class="board" id="board">

    <!-- 工作區 -->
    <main class="work">
      <div class="optbar">
        <label for="bg" data-i18n="label.bg">背景</label>
        <select id="bg">
          <option value="checker" selected data-i18n="bg.checker">棋盤格</option>
          <option value="white" data-i18n="bg.white">白色</option>
          <option value="gray" data-i18n="bg.gray">灰色</option>
          <option value="black" data-i18n="bg.black">黑色</option>
        </select>
        <span class="vr soft"></span>
        <label class="chk"><input type="checkbox" id="solo"> <span data-i18n="chk.solo">只顯示選取的圖層</span></label>
        <span class="tip" data-i18n="tip.click">點畫面可跳到該處最上層的圖層</span>
      </div>
      <div class="tabstrip"><div class="doctab mono" id="doctab">未開啟檔案</div></div>
      <div class="canvasArea" id="canvasArea">
        <div class="empty" id="empty">
          <strong data-i18n="empty.title">還沒有開啟檔案</strong>
          <p class="limits" id="limits" hidden></p>

<script>
/* PSDLite：不解壓縮像素的 PSD 圖層編輯引擎
   - 開檔時只讀檔頭與「圖層紀錄」，像素資料只記位置不讀進記憶體
   - 匯出時用 Blob 把原檔的像素區段整塊接上，記憶體用量與檔案大小無關
   - 預覽需要的像素一次只解碼一張圖層 */
(function (global) {
  "use strict";

  var LARGE_KEYS = ["LMsk","Lr16","Lr32","Layr","Mt16","Mt32","Mtrn","Alph","FMsk","lnk2","FEid","FXid","PxSD","cinf"];
  var SPECIAL_KEYS = ["levl","curv","brit","blnc","hue2","hue ","selc","mixr","grdm","phfl","expA","vibA","thrs","nvrt","post","clrL","blwh","CgEd",
                      "SoCo","GdFl","PtFl","vmsk","vsms","SoLd","PlLd","SoLE","TySh","tySh"];
  var BLEND = {
    "pass":"pass through","norm":"normal","diss":"dissolve","dark":"darken","mul ":"multiply","idiv":"color burn",
    "lbrn":"linear burn","dkCl":"darker color","lite":"lighten","scrn":"screen","div ":"color dodge","lddg":"linear dodge",
    "lgCl":"lighter color","over":"overlay","sLit":"soft light","hLit":"hard light","vLit":"vivid light","lLit":"linear light",
    "pLit":"pin light","hMix":"hard mix","diff":"difference","smud":"exclusion","fsub":"subtract","fdiv":"divide",
    "hue ":"hue","sat ":"saturation","colr":"color","lum ":"luminosity"
  };
  var LAYER_RESOURCE_IDS = [1024, 1026, 1069, 1072];   // 跟圖層數量或順序綁在一起的資源，結構改變時移除

  function OOB(){ var e = new Error("need more data"); e.oob = true; return e; }

  // 錯誤只帶代碼與參數，文字交給介面層翻譯
  function E(code, params){
    var e = new Error(code);
    e.code = code; e.params = params || {};
    return e;
  }

  function Reader(u8, base){
    this.u8 = u8; this.dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    this.pos = 0; this.base = base || 0;
  }
  Reader.prototype.need = function(n){ if (this.pos + n > this.u8.length) throw OOB(); };
  Reader.prototype.u8v = function(){ this.need(1); return this.u8[this.pos++]; };
  Reader.prototype.u16 = function(){ this.need(2); var v = this.dv.getUint16(this.pos); this.pos += 2; return v; };
  Reader.prototype.i16 = function(){ this.need(2); var v = this.dv.getInt16(this.pos); this.pos += 2; return v; };
  Reader.prototype.u32 = function(){ this.need(4); var v = this.dv.getUint32(this.pos); this.pos += 4; return v; };
  Reader.prototype.i32 = function(){ this.need(4); var v = this.dv.getInt32(this.pos); this.pos += 4; return v; };
  Reader.prototype.u64 = function(){ var hi = this.u32(), lo = this.u32(); return hi * 4294967296 + lo; };
  Reader.prototype.sig = function(){ this.need(4); var s = String.fromCharCode(this.u8[this.pos],this.u8[this.pos+1],this.u8[this.pos+2],this.u8[this.pos+3]); this.pos += 4; return s; };
  Reader.prototype.peekSig = function(at){ if (at + 4 > this.u8.length) return ""; return String.fromCharCode(this.u8[at],this.u8[at+1],this.u8[at+2],this.u8[at+3]); };

  async function readRange(file, start, end){
    return new Uint8Array(await file.slice(start, end).arrayBuffer());
  }

  function decodeLegacyName(bytes){
    if (!bytes.length) return "";
    try{ return new TextDecoder("utf-8", { fatal:true }).decode(bytes); }catch(e){}
    try{ return new TextDecoder("big5").decode(bytes); }catch(e){}
    return String.fromCharCode.apply(null, Array.prototype.slice.call(bytes));
  }

  /* ---------- 解析一筆圖層紀錄 ---------- */
  function parseRecord(r, psb){
    var start = r.pos;
    var rec = {};
    rec.top = r.i32(); rec.left = r.i32(); rec.bottom = r.i32(); rec.right = r.i32();
    var n = r.u16();
    rec.channels = [];
    for (var i = 0; i < n; i++){
      var id = r.i16();
      var len = psb ? r.u64() : r.u32();
      rec.channels.push({ id:id, len:len });
    }
    var s = r.sig();
    if (s !== "8BIM" && s !== "8B64") throw E("e.recordFormat");
    rec.blendKey = r.sig();
    rec.opacity = r.u8v();
    rec.clipping = r.u8v();
    rec.flagsOff = r.pos - start;
    rec.flags = r.u8v();
    r.u8v();                                     // filler
    rec.fixedLen = r.pos - start;
    var extraLen = r.u32();
    var extraStart = r.pos, extraEnd = extraStart + extraLen;
    r.need(extraLen);

    // 圖層遮色片
    var maskLen = r.u32();
    var maskStart = r.pos;
    rec.mask = null;
    if (maskLen >= 18){
      var mt = r.i32(), ml = r.i32(), mb = r.i32(), mr = r.i32();
      var dc = r.u8v(), mf = r.u8v();
      rec.mask = { top:mt, left:ml, bottom:mb, right:mr, defaultColor:dc,
                   disabled:!!(mf & 2), positionRelativeToLayer:!!(mf & 1) };
    }
    r.pos = maskStart + maskLen;
    rec.maskBytes = [maskStart - 4, r.pos];           // 含長度欄位

    // 混合範圍
    var blendLen = r.u32();
    r.pos += blendLen;
    r.need(0);
    rec.blendBytes = [rec.maskBytes[1], r.pos];

    // Pascal 名稱
    var nlen = r.u8v();
    r.need(nlen);
    var legacy = r.u8.subarray(r.pos, r.pos + nlen);
    r.pos += nlen;
    // 名稱照規定要補到 4 的倍數，但有些軟體沒補，就往後找下一個區塊標記
    var guard = 0;
    while (r.pos < extraEnd - 4 && guard < 4){
      var ps = r.peekSig(r.pos);
      if (ps === "8BIM" || ps === "8B64") break;
      r.pos++; guard++;
    }
    rec.nameEnd = r.pos;

    // 附加資訊區塊
    rec.blocks = [];
    rec.special = false;
    rec.sectionType = 0;
    rec.sectionBlend = null;
    var uni = null;
    while (r.pos + 12 <= extraEnd){
      var bs = r.peekSig(r.pos);
      if (bs !== "8BIM" && bs !== "8B64") break;
      var bStart = r.pos;
      r.pos += 4;
      var key = r.sig();
      var large = bs === "8B64" || (psb && LARGE_KEYS.indexOf(key) !== -1);
      var blen = large ? r.u64() : r.u32();
      var dStart = r.pos;
      var next = dStart + blen + (blen % 2);
      if (next > extraEnd) next = extraEnd;
      r.need(next - r.pos);
      if (key === "luni" && blen >= 4){
        var cnt = r.u32();
        var chars = [];
        for (var k = 0; k < cnt && r.pos + 2 <= dStart + blen; k++) chars.push(r.u16());
        uni = String.fromCharCode.apply(null, chars);
      } else if ((key === "lsct" || key === "lsdk") && blen >= 4){
        rec.sectionType = r.u32();
        if (blen >= 12){ r.pos += 4; rec.sectionBlend = r.sig(); }
      }
      if (SPECIAL_KEYS.indexOf(key) !== -1) rec.special = true;
      rec.blocks.push({ key:key, start:bStart, end:next });
      r.pos = next;
    }
    rec.tailBytes = [r.pos, extraEnd];
    r.pos = extraEnd;

    rec.name = uni !== null ? uni : decodeLegacyName(legacy);
    rec.hasLuni = uni !== null;
    rec.raw = r.u8.slice(start, extraEnd);
    // 以上位置都換成相對於這筆紀錄開頭
    var shift = function(p){ return [p[0] - start, p[1] - start]; };
    rec.maskBytes = shift(rec.maskBytes);
    rec.blendBytes = shift(rec.blendBytes);
    rec.tailBytes = shift(rec.tailBytes);
    rec.nameEnd -= start;
    rec.blocks.forEach(function(b){ b.start -= start; b.end -= start; });
    rec.chanLen = rec.channels.reduce(function(s, c){ return s + c.len; }, 0);
    return rec;
  }

  /* ---------- 開檔 ---------- */
  async function open(file){
    var size = file.size;
    var head = await readRange(file, 0, Math.min(size, 64));
    var r = new Reader(head);
    if (r.sig() !== "8BPS") throw E("e.notPsd");
    var version = r.u16();
    if (version !== 1 && version !== 2) throw E("e.version", { v:version });
    var psb = version === 2;
    r.pos += 6;
    var channels = r.u16(), height = r.u32(), width = r.u32(), depth = r.u16(), mode = r.u16();
    if (depth !== 8) throw E("e.depth", { d:depth });
    if (mode !== 3 && mode !== 1) throw E("e.mode", { m:mode });

    var pos = 26;
    var cmLen = new DataView((await readRange(file, pos, pos + 4)).buffer).getUint32(0);
    var irLenPos = pos + 4 + cmLen;
    var irLen = new DataView((await readRange(file, irLenPos, irLenPos + 4)).buffer).getUint32(0);
    var irStart = irLenPos + 4, irEnd = irStart + irLen;
    var irBytes = await readRange(file, irStart, irEnd);

    var lmLenPos = irEnd;
    var lmHead = new Reader(await readRange(file, lmLenPos, lmLenPos + 32));
    var lmLen = psb ? lmHead.u64() : lmHead.u32();
    var lmStart = lmHead.pos + lmLenPos, lmEnd = lmStart + lmLen;
    if (lmLen === 0) throw E("e.noLayers");
    var liLen = psb ? lmHead.u64() : lmHead.u32();
    var liStart = lmLenPos + lmHead.pos, liEnd = liStart + liLen;
    if (liLen === 0) throw E("e.noLayerData");
    if (liEnd > lmEnd || lmEnd > size) throw E("e.broken");

    // 圖層紀錄通常只有幾 MB；不夠就加倍重讀
    var want = Math.min(liLen, 4 * 1024 * 1024);
    var records, count, rr;
    for (;;){
      var buf = await readRange(file, liStart, liStart + want);
      rr = new Reader(buf);
      try{
        count = rr.i16();
        records = [];
        for (var i = 0; i < Math.abs(count); i++) records.push(parseRecord(rr, psb));
        break;
      }catch(e){
        if (!e.oob || want >= liLen) throw e.oob ? E("e.recordFail") : e;
        want = Math.min(liLen, want * 4);
      }
    }
    var chanStart = liStart + rr.pos;
    var off = chanStart;
    records.forEach(function(rec){ rec.chanOff = off; off += rec.chanLen; });
    var chanEnd = off;
    if (chanEnd > liEnd) throw E("e.chanRange");

    // 由上往下組成樹狀結構，children 陣列維持「最下面在前面」
    var root = { children:[] };
    var stack = [root];
    for (var j = records.length - 1; j >= 0; j--){
      var rec = records[j];
      var t = rec.sectionType;
      if (t === 3){
        var g = stack.length > 1 ? stack.pop() : null;
        if (g) g.__end = rec;
        continue;
      }
      var node = makeLayer(rec);
      stack[stack.length - 1].children.unshift(node);
      if (t === 1 || t === 2){ node.children = []; stack.push(node); }
    }
    while (stack.length > 1) stack.pop();   // 容錯：缺少結尾標記

    return {
      file:file, psb:psb, version:version, width:width, height:height, depth:depth, mode:mode, channels:channels,
      irLenPos:irLenPos, irBytes:irBytes, lmLenPos:lmLenPos, lmEnd:lmEnd, liEnd:liEnd, liLen:liLen,
      countNegative: count < 0, recordCount: records.length, root: root,
      bytes: { layerData: chanEnd - chanStart }
    };
  }

  function makeLayer(rec){
    var L = {
      name: rec.name,
      hidden: !!(rec.flags & 2),
      opacity: rec.opacity / 255,
      clipping: rec.clipping === 1,
      blendMode: BLEND[(rec.sectionType === 1 || rec.sectionType === 2) && rec.sectionBlend ? rec.sectionBlend : rec.blendKey] || "normal",
      top: rec.top, left: rec.left, bottom: rec.bottom, right: rec.right,
      mask: rec.mask,
      special: rec.special,
      __rec: rec
    };
    return L;
  }

  /* ---------- 像素解碼（一次一個通道） ---------- */
  function unpackRLE(src, sp, dst, dp, rowLen){
    var end = dp + rowLen;
    while (dp < end && sp < src.length){
      var n = src[sp++];
      if (n > 128) n -= 256;
      if (n >= 0){
        var c = n + 1;
        if (dp + c > end) c = end - dp;
        dst.set(src.subarray(sp, sp + c), dp);
        sp += n + 1; dp += c;
      } else if (n !== -128){
        var c2 = 1 - n;
        if (dp + c2 > end) c2 = end - dp;
        dst.fill(src[sp++], dp, dp + c2);
        dp += c2;
      }
    }
  }

  async function inflate(bytes){
    var ds = new DecompressionStream("deflate");
    var stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function decodePlane(buf, comp, w, h, psb){
    var n = w * h;
    var out = new Uint8Array(n);
    if (!n) return out;
    if (comp === 0){
      out.set(buf.subarray(0, Math.min(n, buf.length)));
    } else if (comp === 1){
      var cs = psb ? 4 : 2;
      var dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
      var sp = h * cs;
      for (var y = 0; y < h; y++){
        var rowBytes = psb ? dv.getUint32(y * 4) : dv.getUint16(y * 2);
        unpackRLE(buf.subarray(sp, sp + rowBytes), 0, out, y * w, w);
        sp += rowBytes;

  var LANG = "zh";

  // 有些函式內的區域變數也叫 t，那裡改用 tr
  function tr(key, vars){ return t(key, vars); }

  function t(key, vars){
    var d = I18N[LANG] || I18N.zh;
    var s = d[key];
    if (s === undefined) s = I18N.zh[key];
    if (s === undefined) return key;
    if (vars){
      Object.keys(vars).forEach(function(k){ s = s.split("{" + k + "}").join(vars[k]); });
    }
    return s;
  }

  // 把有 data-i18n 記號的元素文字換成目前語言
  function applyLang(){
    document.documentElement.lang = t("html.lang");
    document.title = t("app.title");
    var nodes = document.querySelectorAll("[data-i18n],[data-i18n-title],[data-i18n-ph],[data-i18n-aria]");
    for (var i = 0; i < nodes.length; i++){
      var el = nodes[i];
      if (el.hasAttribute("data-i18n")) el.textContent = t(el.getAttribute("data-i18n"));
      if (el.hasAttribute("data-i18n-title")) el.title = t(el.getAttribute("data-i18n-title"));
      if (el.hasAttribute("data-i18n-ph")) el.placeholder = t(el.getAttribute("data-i18n-ph"));
      if (el.hasAttribute("data-i18n-aria")) el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria")));
    }
    $("export").title = (window.claude && window.claude.use) ? t("btn.export.title.zip") : t("btn.export.title.direct");
    $("edition").textContent = t(EDITION === "free" ? "edition.free" : "edition.pro");
    $("edition").className = "badge" + (EDITION === "free" ? " free" : "");
    if (EDITION === "free"){
      $("limits").hidden = false;
      $("limits").textContent = t("free.limits", {
        n: MAX_LAYERS || "\u221E",
        size: MAX_BYTES ? formatSize(MAX_BYTES) : "\u221E"
      });
      $("upsell").hidden = false;
      $("upsell").href = STORE_URL;
      $("upsell").textContent = t("free.upgrade");
    }
    if (S.psd){
      $("hint").textContent = t("msg.opened", { name:S.fileName, n:S.all.length, size:formatSize(S.fileSize || 0) });
      fitStage();
      render();
    } else {
      $("hint").textContent = t("hint.none");
      $("doctab").textContent = t("doctab.none");
      $("tree").innerHTML = '<div class="tree-empty">' + esc(t("tree.empty")) + "</div>";
    }
    syncSideUI();
    if (!S.psd) refreshSide();
    resay();
  }

  // 各語言的左右預設寫法；使用者沒改過才跟著語言換
  var SIDE_DEFAULTS = { zh:["\u5DE6","\u53F3"], en:["L","R"], ja:["\u5DE6","\u53F3"] };

  function swapSideDefaults(from, to){
    var a = SIDE_DEFAULTS[from] || SIDE_DEFAULTS.zh;
    var b = SIDE_DEFAULTS[to] || SIDE_DEFAULTS.zh;
    if ($("ltext").value === a[0]) $("ltext").value = b[0];
    if ($("rtext").value === a[1]) $("rtext").value = b[1];
  }

  function setLang(v){
    if (!I18N[v]) v = "zh";
    swapSideDefaults(LANG, v);
    LANG = v;
    $("lang").value = v;
    try{ localStorage.setItem("psdr-lang", v); }catch(e){}
    applyLang();
  }

  (function(){
    var saved = null;
    try{ saved = localStorage.getItem("psdr-lang"); }catch(e){}
    if (!I18N[saved]){
      var n = (navigator.language || "zh").toLowerCase();
      saved = n.indexOf("ja") === 0 ? "ja" : (n.indexOf("zh") === 0 ? "zh" : "en");
    }
    LANG = saved;
    var d = SIDE_DEFAULTS[saved] || SIDE_DEFAULTS.zh;
    $("ltext").value = d[0];
    $("rtext").value = d[1];
  })();

  // 把引擎丟出的錯誤翻成目前語言
  function errText(err){
    if (err && err.code && I18N.zh[err.code]) return t(err.code, err.params);
    return (err && err.message) ? err.message : String(err);
  }


  /* ---------- 介面亮度 ---------- */

  function applyTheme(v){
    if (["dark","mid","light"].indexOf(v) === -1) v = "dark";
    document.documentElement.setAttribute("data-theme", v);
    $("theme").value = v;
    try{ localStorage.setItem("psdr-theme", v); }catch(e){}
    drawOverlay();
  }
  (function(){
    var saved = null;
    try{ saved = localStorage.getItem("psdr-theme"); }catch(e){}
    if (["dark","mid","light"].indexOf(saved) === -1) saved = "dark";
    document.documentElement.setAttribute("data-theme", saved);
    $("theme").value = saved;
  })();
  $("theme").addEventListener("change", function(){ applyTheme(this.value); });
  $("lang").addEventListener("change", function(){ setLang(this.value); });

  /* ---------- 讀檔 ---------- */

  $("pick").addEventListener("click", function(){ $("file").click(); });
  $("file").addEventListener("change", function(e){
    var f = e.target.files && e.target.files[0];
    if (f) loadFile(f);
  });

  function loadFile(file){
    if (typeof PSDLite === "undefined"){
      showError(t("msg.notLoaded"));
      return;
    }
    if (MAX_BYTES && file.size > MAX_BYTES){
      showError(t("e.fileTooBig", { size:formatSize(file.size), max:formatSize(MAX_BYTES) }));
      return;
    }
    S.fileName = file.name;
    S.fileSize = file.size;
    S.gen = (S.gen || 0) + 1;
    $("busy").textContent = t("busy.read");
    $("busy").classList.add("show");
    PSDLite.open(file).then(function(doc){
      if (MAX_LAYERS){
        var total = 0;
        (function count(list){ list.forEach(function(l){ total++; if (l.children) count(l.children); }); })(doc.root.children);
        if (total > MAX_LAYERS){
          $("busy").classList.remove("show");
          showError(t("e.tooManyLayers", { n:total, max:MAX_LAYERS }));
          return;
        }
      }
      S.doc = doc;
      S.psd = { width:doc.width, height:doc.height, children:doc.root.children };
      keyCounter = 0;
      S.byKey = {}; S.collapsed = {}; S.selected = {};
      S.renames = {}; S.history = []; S.thumbs = {};
      S.deleted = {}; S.emptyList = [];
      S.sideMark = {};
      S.pcache = {}; S.mcache = {};
      S.structureChanged = false;
      S.lastIndex = null;
      tagLayers(S.psd.children);
      setupStage();
      rebuild();
      $("busy").classList.remove("show");
      $("errbox").hidden = true;
      $("empty").hidden = true;
      $("stage").hidden = false;
      $("hint").textContent = t("msg.opened", { name:S.fileName, n:S.all.length, size:formatSize(file.size) });
      fitStage();
      S.previews = buildPreviews(S.gen);
    }).catch(function(err){
      $("busy").classList.remove("show");
      console.error(err);
      showError(errText(err));
    });
  }

  function formatSize(n){
    if (n >= 1073741824) return (n / 1073741824).toFixed(2) + " GB";
    if (n >= 1048576) return Math.round(n / 1048576) + " MB";
    return Math.max(1, Math.round(n / 1024)) + " KB";
  }

  function showError(msg){
    say("msg.openFail", { msg:msg }, true);
    $("errmsg").textContent = msg;
    $("errbox").hidden = false;
    if (!S.psd){ $("empty").hidden = false; $("stage").hidden = true; }
  }

  /* ---------- 背景產生預覽：一次只解碼一張，用完就丟 ---------- */

  var BIG_PIXELS = 48 * 1024 * 1024;   // 超過這個像素數改用取樣縮圖，避免一次吃太多記憶體

  function planesToCanvas(w, h, R, G, B, A){
    var w2 = Math.max(1, Math.round(w * S.sc)), h2 = Math.max(1, Math.round(h * S.sc));
    var small = document.createElement("canvas");
    small.width = w2; small.height = h2;
    var sctx = small.getContext("2d");
    G = G || R; B = B || R;
    if (w * h <= BIG_PIXELS){
      var img = new ImageData(w, h);
      var u = new Uint32Array(img.data.buffer);
      var n = w * h, i;
      if (A){ for (i = 0; i < n; i++) u[i] = ((A[i] << 24) | (B[i] << 16) | (G[i] << 8) | R[i]) >>> 0; }
      else  { for (i = 0; i < n; i++) u[i] = (0xFF000000 | (B[i] << 16) | (G[i] << 8) | R[i]) >>> 0; }
      var full = document.createElement("canvas");
      full.width = w; full.height = h;
      full.getContext("2d").putImageData(img, 0, 0);
      sctx.imageSmoothingQuality = "high";
      sctx.drawImage(full, 0, 0, w2, h2);
      full.width = full.height = 0;
    } else {
      var im2 = new ImageData(w2, h2), u2 = new Uint32Array(im2.data.buffer);
      for (var y = 0; y < h2; y++){
        var sy = Math.min(h - 1, Math.floor(y / S.sc)) * w;
        for (var x = 0; x < w2; x++){
          var k = sy + Math.min(w - 1, Math.floor(x / S.sc));
          u2[y * w2 + x] = (((A ? A[k] : 255) << 24) | (B[k] << 16) | (G[k] << 8) | R[k]) >>> 0;
        }
      }
      sctx.putImageData(im2, 0, 0);
    }
    return small;
  }

  function nextTick(){ return new Promise(function(r){ setTimeout(r, 0); }); }

  async function buildPreviews(gen){
    var list = S.all.filter(function(n){ return !n.isGroup; });
    var done = 0;
    for (var i = 0; i < list.length; i++){
      if (gen !== S.gen) return;
      var l = list[i].layer, key = list[i].key;
      $("status").textContent = t("msg.previewing", { i:(i + 1), n:list.length });
      $("status").className = "status show ok";
      try{
        var d = await PSDLite.decodeLayer(S.doc, l);
        if (gen !== S.gen) return;
        var hasPix = d.w > 0 && d.h > 0 && d.planes[0];
        l.__empty = l.special ? false : (!hasPix ? true : (d.hasAlpha ? !PSDLite.planeHasContent(d.planes[-1]) : false));
        if (hasPix){
          S.pcache[key] = { canvas: planesToCanvas(d.w, d.h, d.planes[0], d.planes[1], d.planes[2], d.planes[-1]),
                            x:(l.left||0)*S.sc, y:(l.top||0)*S.sc, w:d.w*S.sc, h:d.h*S.sc };
          updateThumb(list[i]);
        }
        if (d.mask && l.mask){
          var m = l.mask, g = d.mask.gray;
          var mc = planesToCanvas(d.mask.w, d.mask.h, g, g, g, g);
          var mx = m.left || 0, my = m.top || 0;
          if (m.positionRelativeToLayer){ mx += (l.left||0); my += (l.top||0); }
          S.mcache[key] = { canvas:mc, x:mx*S.sc, y:my*S.sc, w:d.mask.w*S.sc, h:d.mask.h*S.sc, outside:(m.defaultColor||0)/255 };
        }
      }catch(e){
        console.warn("preview decode failed", l.name, e);
        l.__empty = false;
      }
      done++;
      if (done % 6 === 0) requestComposite();
      await nextTick();
    }
    S.previewsDone = true;
    requestComposite();
    say("msg.previewDone", false);
  }

  function updateThumb(n){
    delete S.thumbs[n.key];
    var th = $("tree").querySelector('.row[data-key="' + n.key + '"] .thumb');
    if (!th) return;
    var u = thumbFor(n);
    if (!u) return;
    th.innerHTML = "";
    var im = document.createElement("img"); im.src = u; im.alt = ""; th.appendChild(im);
  }

  // 給每一層貼上一個不會變的編號標籤，之後才找得回來
  function tagLayers(list){
    for (var i=0;i<list.length;i++){
      var l = list[i];
      l.__key = "k" + (keyCounter++);
      S.byKey[l.__key] = l;
      if (l.children) tagLayers(l.children);
    }
  }

  /* ---------- 建立扁平清單 ---------- */

  function rebuild(){
    S.all = [];
    walk(S.psd.children || [], 0, []);
    render();
  }

  function walk(list, depth, ancestors){
    var arr = S.reversed ? list.slice().reverse() : list.slice();
    for (var i=0;i<arr.length;i++){
      var l = arr[i];
      S.all.push({ key:l.__key, layer:l, depth:depth,
                   isGroup:!!l.children, ancestors:ancestors.slice() });
      if (l.children) walk(l.children, depth+1, ancestors.concat([l.__key]));
    }
  }

  function visibleNodes(){
    return S.all.filter(function(n){
      for (var i=0;i<n.ancestors.length;i++){
        if (S.collapsed[n.ancestors[i]]) return false;
      }
      return true;
    });
  }

  /* ---------- 檢視視窗 ---------- */

  var EYE_ON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><path d="M2.5 13.5l11-11"/></svg>';

  var PREVIEW_MAX = 1200;   // 預覽最長邊，太大會拖慢

  function setupStage(){
    var w = S.psd.width, h = S.psd.height;
    S.sc = Math.min(1, PREVIEW_MAX / Math.max(w, h));
    var W = Math.max(1, Math.round(w*S.sc)), H = Math.max(1, Math.round(h*S.sc));
    S.W = W; S.H = H;
    ["comp","ovl"].forEach(function(id){ $(id).width = W; $(id).height = H; });
    $("docsize").textContent = w + " \u00D7 " + h + " px";
  }

  // 讓文件在工作區裡完整顯示，四周留一點邊
  function fitStage(){
    if (!S.psd) return;
    var area = $("canvasArea");
    var aw = Math.max(40, area.clientWidth - 48);
    var ah = Math.max(40, area.clientHeight - 48);
    var z = Math.min(aw / S.psd.width, ah / S.psd.height, 1);
    var st = $("stage");
    st.style.width = Math.round(S.psd.width * z) + "px";
    st.style.height = Math.round(S.psd.height * z) + "px";
    var pct = Math.max(1, Math.round(z * 100));
    $("zoom").textContent = pct + "%";
    $("doctab").textContent = S.fileName + " @ " + pct + "%";
  }
  window.addEventListener("resize", fitStage);

  function blank(){
    var c = document.createElement("canvas");
    c.width = S.W; c.height = S.H;
    return c;
  }

  function scaledPixels(l){ return S.pcache[l.__key] || null; }
  function hasMask(l){ return !!(l.mask && !l.mask.disabled && S.mcache[l.__key]); }
  function scaledMask(l){ return S.mcache[l.__key] || null; }

  function applyMask(l, ctx){
    if (!hasMask(l)) return;
    var sm = scaledMask(l);
    if (!sm) return;
    var mc = blank(), mctx = mc.getContext("2d");
    if (sm.outside > 0){
      mctx.fillStyle = "rgba(0,0,0," + sm.outside + ")";
      mctx.fillRect(0, 0, S.W, S.H);
      mctx.clearRect(sm.x, sm.y, sm.w, sm.h);
    }
    mctx.drawImage(sm.canvas, sm.x, sm.y, sm.w, sm.h);
    ctx.save();
    ctx.globalCompositeOperation = "destination-in";
    ctx.drawImage(mc, 0, 0);
    ctx.restore();
  }

  var BLEND = {
    "multiply":"multiply", "screen":"screen", "overlay":"overlay",
    "darken":"darken", "lighten":"lighten",
    "color dodge":"color-dodge", "color burn":"color-burn",
    "hard light":"hard-light", "soft light":"soft-light",
    "difference":"difference", "exclusion":"exclusion",
    "hue":"hue", "saturation":"saturation", "color":"color", "luminosity":"luminosity",
    "linear dodge":"lighter"
  };
  function blendOf(l){ return BLEND[l.blendMode] || "source-over"; }
  function opacityOf(l){ return (l.opacity === undefined) ? 1 : l.opacity; }

  // 一張圖層（或整個資料夾）放到全畫面大小的畫布上，套好遮色片
  function placeLayer(l){
    var c = blank(), ctx = c.getContext("2d");
    if (l.children){
      ctx.drawImage(renderGroup(l.children), 0, 0);
    } else {
      var sm = scaledPixels(l);
      if (sm) ctx.drawImage(sm.canvas, sm.x, sm.y, sm.w, sm.h);
    }
    applyMask(l, ctx);
    return c;
  }

  function drawLayerInto(ctx, l){
    ctx.save();
    ctx.globalAlpha = opacityOf(l);
    ctx.globalCompositeOperation = blendOf(l);
    if (!l.children && !hasMask(l)){
      var sm = scaledPixels(l);          // 最常見的情況：直接畫，最快
      if (sm) ctx.drawImage(sm.canvas, sm.x, sm.y, sm.w, sm.h);
    } else {
      ctx.drawImage(placeLayer(l), 0, 0);
    }
    ctx.restore();
  }

  // children 在 PSD 裡是「最下面的在前面」，照順序一層一層疊上去
  function renderGroup(children){
    var c = blank(), ctx = c.getContext("2d");
    var base = null, baseHidden = false, baseCanvas = null;
    for (var i=0;i<children.length;i++){
      var l = children[i];
      if (S.deleted[l.__key]) continue;
      if (!l.clipping){
        base = l; baseHidden = !!l.hidden; baseCanvas = null;
        if (!l.hidden) drawLayerInto(ctx, l);
      } else {
        // 剪裁遮色片：只畫在下面那張基底圖層有東西的地方
        if (!base || baseHidden || l.hidden) continue;
        if (!baseCanvas) baseCanvas = placeLayer(base);
        var t = placeLayer(l), tctx = t.getContext("2d");
        tctx.globalCompositeOperation = "destination-in";
        tctx.drawImage(baseCanvas, 0, 0);
        ctx.save();
        ctx.globalAlpha = opacityOf(l);
        ctx.globalCompositeOperation = blendOf(l);
        ctx.drawImage(t, 0, 0);
        ctx.restore();
      }
    }
    return c;
  }

  // 「只顯示選取」：不管開關，把選到的圖層（和選到的資料夾裡的圖層）照順序畫出來
  function renderSolo(){
    var c = blank(), ctx = c.getContext("2d");
    (function walk(list, inside){
      for (var i=0;i<list.length;i++){
        var l = list[i];
        if (S.deleted[l.__key]) continue;
        var on = inside || !!S.selected[l.__key];
        if (l.children) walk(l.children, on);
        else if (on) drawLayerInto(ctx, l);
      }
    })(S.psd.children || [], false);
    return c;
  }

  var compPending = false;
  function requestComposite(){
    if (compPending || !S.psd) return;
    compPending = true;
    requestAnimationFrame(function(){
      compPending = false;
      try{
        var img = $("solo").checked ? renderSolo() : renderGroup(S.psd.children || []);
        var ctx = $("comp").getContext("2d");
        ctx.clearRect(0, 0, S.W, S.H);
        ctx.drawImage(img, 0, 0);
      }catch(e){
        say("msg.drawFail", { msg:e.message }, true);
      }
    });
  }

  // 選取的圖層畫虛線框，方便對照「這張到底是哪裡」
  function drawOverlay(){
    if (!S.psd) return;
    var ctx = $("ovl").getContext("2d");
    ctx.clearRect(0, 0, S.W, S.H);
    var mark = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#F59E85";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 4]);
    S.all.forEach(function(n){
      if (!S.selected[n.key] || n.isGroup) return;
      var l = n.layer;
      var w = (l.right||0) - (l.left||0), h = (l.bottom||0) - (l.top||0);
      if (w <= 0 || h <= 0) return;
      var x = (l.left||0)*S.sc, y = (l.top||0)*S.sc;
      ctx.strokeStyle = "rgba(255,255,255,.9)";
      ctx.strokeRect(x+.5, y+.5, w*S.sc, h*S.sc);
      ctx.strokeStyle = mark;
      ctx.lineDashOffset = 4;
      ctx.strokeRect(x+.5, y+.5, w*S.sc, h*S.sc);
      ctx.lineDashOffset = 0;
    });
  }

  // 點畫面：從最上面往下找，第一張在那個位置有像素、而且是開著的圖層
  function pickAt(px, py){
    var hit = null;
    (function walk(list){
      for (var i=list.length-1;i>=0 && !hit;i--){
        var l = list[i];
        if (S.deleted[l.__key] || l.hidden) continue;
        if (l.children){ walk(l.children); continue; }
        var sm = S.pcache[l.__key];
        if (!sm) continue;
        var x = Math.floor(px * S.sc - sm.x), y = Math.floor(py * S.sc - sm.y);
        if (x < 0 || y < 0 || x >= sm.canvas.width || y >= sm.canvas.height) continue;
        if (sm.canvas.getContext("2d").getImageData(x, y, 1, 1).data[3] > 0) hit = l;
      }
    })(S.psd.children || []);
    return hit;
  }

  $("stage").addEventListener("click", function(ev){
    if (!S.psd) return;
    var r = this.getBoundingClientRect();
    var px = (ev.clientX - r.left) / r.width * S.psd.width;
    var py = (ev.clientY - r.top) / r.height * S.psd.height;
    var hit = pickAt(px, py);
    if (hit) navigateTo(hit.__key);
    else say("msg.nothingHere", false);
  });

  $("bg").addEventListener("change", function(){
    $("stage").className = "stage bg-" + this.value;
  });
  $("solo").addEventListener("change", requestComposite);

  /* ---------- 縮圖 ---------- */

  function thumbFor(node){
    if (S.thumbs[node.key]) return S.thumbs[node.key];
    var sm = scaledPixels(node.layer);
    if (!sm) return null;
    try{
      var src = sm.canvas, box = 34;
      var scale = Math.min(box/src.width, box/src.height, 1);
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(src.width*scale));
      c.height = Math.max(1, Math.round(src.height*scale));
      c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
      S.thumbs[node.key] = c.toDataURL("image/png");
      return S.thumbs[node.key];
    }catch(e){ return null; }
  }

  var PEN_ICON = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 10l1-3 5-5 2 2-5 5z" fill="none" stroke="currentColor" stroke-width="1.2"></path></svg>';
  var TW_OPEN = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3h7L5 8z" fill="currentColor"></path></svg>';
  var TW_CLOSED = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.5v7L8 5z" fill="currentColor"></path></svg>';
  var FOLDER_ICON = '<svg viewBox="0 0 34 28" aria-hidden="true"><path d="M2 5h11l3 3h16v18H2z" fill="var(--folder)" stroke="var(--line)" stroke-width="1"></path></svg>';

  function metaOf(l){
    var op = Math.round(((l.opacity === undefined) ? 1 : l.opacity) * 100);
    var bm = l.blendMode || (l.children ? "pass through" : "normal");
    var name = I18N.zh["bm." + bm] ? t("bm." + bm) : bm;
    return t("meta.fmt", { op:op, mode:name });
  }

  /* ---------- 畫出圖層清單 ---------- */

  function render(){
    var tree = $("tree");
    tree.innerHTML = "";
    var nodes = visibleNodes();
    var dup = findDuplicates();
    var frag = document.createDocumentFragment();

    nodes.forEach(function(n){
      var l = n.layer;
      var row = document.createElement("div");
      row.className = "row" + (n.isGroup ? " group" : "")
                    + (S.selected[n.key] ? " sel" : "")
                    + (S.deleted[n.key] ? " gone" : "")
                    + (l.hidden ? " off" : "");
      row.dataset.key = n.key;
      row.draggable = true;

      // 眼睛欄
      var eye = document.createElement("button");
      eye.type = "button";
      eye.className = "eye";
      eye.title = l.hidden ? t("row.eye.show") : t("row.eye.hide");
      eye.setAttribute("aria-label", l.hidden ? t("row.eye.show.aria") : t("row.eye.hide.aria"));
      eye.innerHTML = l.hidden ? "" : EYE_ON;
      eye.addEventListener("click", function(ev){
        ev.stopPropagation();
        l.hidden = !l.hidden;
        requestComposite();
        render();
      });
      row.appendChild(eye);

      // 編輯中（筆形）欄
      var pen = document.createElement("span");
      pen.className = "pen";
      if (S.selected[n.key] && !n.isGroup) pen.innerHTML = PEN_ICON;
      row.appendChild(pen);

      var ind = document.createElement("span");
      ind.className = "indent";
      ind.style.width = (n.depth * 14) + "px";
      row.appendChild(ind);

      var tw = document.createElement("span");
      tw.className = "twist";
      if (n.isGroup){
        tw.innerHTML = S.collapsed[n.key] ? TW_CLOSED : TW_OPEN;
        tw.addEventListener("click", function(ev){
          ev.stopPropagation();
          S.collapsed[n.key] = !S.collapsed[n.key];
          render();
        });
      }
      row.appendChild(tw);

      var th = document.createElement("span");
      th.className = "thumb" + (n.isGroup ? " folder" : "") + (l.clipping ? " clip" : "");
      if (n.isGroup){ th.innerHTML = FOLDER_ICON; }
      else {
        var u = thumbFor(n);
        if (u){ var im = document.createElement("img"); im.src = u; im.alt = ""; th.appendChild(im); }
      }
      if (l.clipping) th.title = t("row.clip");
      row.appendChild(th);

      // 兩行文字：上面是不透明度與混合模式，下面是名稱
      var lab = document.createElement("span");
      lab.className = "label";
      var meta = document.createElement("span");
      meta.className = "meta mono";
      meta.textContent = metaOf(l);
      lab.appendChild(meta);

      var nm = document.createElement("span");
      nm.className = "name";
      nm.title = t("row.rename.title");
      var renamed = S.renames[n.key];
      if (renamed){
        var o = document.createElement("span"); o.className = "old"; o.textContent = l.name || "";
        var w = document.createElement("span"); w.className = "new"; w.textContent = renamed;
        nm.appendChild(o); nm.appendChild(w);
      } else {
        nm.textContent = l.name || t("name.untitled");
      }
      lab.appendChild(nm);
      row.appendChild(lab);

      if (S.sideMark[n.key]){
        var mk = document.createElement("span");
        mk.className = "mark";
        mk.textContent = S.sideMark[n.key] === "L" ? ($("ltext").value || t("side.L")) : ($("rtext").value || t("side.R"));
        mk.title = t("tag.mark.title");
        row.appendChild(mk);
      }
      if (dup.keys[n.key]){
        var dt = document.createElement("span");
        dt.className = "tag";
        dt.textContent = t("tag.dup");
        dt.title = t("tag.dup.title");
        row.appendChild(dt);
      }
      if (S.deleted[n.key]){
        var tg = document.createElement("span");
        tg.className = "tag";
        tg.textContent = t("tag.gone");
        row.appendChild(tg);
      }

      if (n.isGroup){
        var acts = document.createElement("span");
        acts.className = "acts";
        var b = document.createElement("button");
        b.type = "button";
        b.className = "tiny"; b.textContent = t("btn.selectInside");
        b.title = t("btn.selectInside.title");
        b.addEventListener("click", function(ev){
          ev.stopPropagation();
          selectInside(n.key);
        });
        acts.appendChild(b);
        row.appendChild(acts);
      }

      row.addEventListener("click", function(ev){ onRowClick(ev, n); });
      frag.appendChild(row);
    });

    tree.appendChild(frag);
    renderDupPanel(dup);
    renderEmptyPanel();
    drawOverlay();
    if ($("solo").checked) requestComposite();
    refreshSide();
  }

  /* ---------- 選取邏輯 ---------- */

  var lastClick = null;
  function onRowClick(ev, node){
    var now = Date.now();
    var plain = !ev.shiftKey && !ev.ctrlKey && !ev.metaKey;
    if (plain && lastClick && lastClick.key === node.key && now - lastClick.t < 450){
      lastClick = null;
      S.selected = {}; S.selected[node.key] = true;
      startEdit(node.key);
      return;
    }
    lastClick = plain ? { key:node.key, t:now } : null;

    var nodes = visibleNodes();
    var idx = nodes.findIndex(function(x){ return x.key === node.key; });

    if (ev.shiftKey && S.lastIndex !== null){
      var a = Math.min(S.lastIndex, idx), b = Math.max(S.lastIndex, idx);
      for (var i=a;i<=b;i++) S.selected[nodes[i].key] = true;
    } else if (ev.ctrlKey || ev.metaKey){
      if (S.selected[node.key]) delete S.selected[node.key];
      else S.selected[node.key] = true;
      S.lastIndex = idx;
    } else {
      S.selected = {};
      S.selected[node.key] = true;
      S.lastIndex = idx;
    }
    render();
  }

  function selectInside(groupKey){
    S.selected = {};
    S.all.forEach(function(n){
      if (!n.isGroup && n.ancestors.indexOf(groupKey) !== -1) S.selected[n.key] = true;
    });
    S.lastIndex = null;
    render();
  }

  /* ---------- 右側面板 ---------- */

  function selectedNodes(){
    return S.all.filter(function(n){ return S.selected[n.key]; });
  }

  function orderedTargets(){
    var sel = selectedNodes();          // 已經是畫面上的順序
    if ($("dir").value === "bu") sel = sel.slice().reverse();
    return sel;
  }

  function buildName(i){
    var base = $("base").value;
    var sep = $("sep").value;
    var pad = parseInt($("pad").value, 10);
    var start = parseInt($("start").value, 10);
    if (isNaN(start)) start = 1;
    var num = String(start + i);
    while (num.length < pad) num = "0" + num;
    return base + sep + num;
  }

  function refreshSide(){
    var sel = orderedTargets();
    var n = sel.length;
    $("count").textContent = n ? t("count.sel", { n:n }) : t("count.none");
    var hasBase = $("base").value.length > 0;
    $("apply").disabled = !(n && hasBase);
    $("undo").disabled = S.history.length === 0;
    $("reset").disabled = Object.keys(S.renames).length === 0;
    ["addL","addR","stripSide","btnSfx1","btnSfx2"].forEach(function(id){ $(id).disabled = !n; });
    refreshQueue();
    refreshCurName();

    var box = $("preview");
    if (!n || !hasBase){
      box.innerHTML = '<span class="empty-t">' + esc(t("preview.empty")) + '</span>';
      return;
    }
    var html = "";
    for (var i=0;i<Math.min(n, 12);i++){
      var old = sel[i].layer.name || tr("name.untitled");
      html += '<div class="mono">' + esc(old) + ' → <b>' + esc(buildName(i)) + '</b></div>';
    }
    if (n > 12) html += '<div>' + esc(tr("preview.more", { n:(n-12) })) + '</div>';
    box.innerHTML = html;
  }

  // 只選到一張時，這個欄位就是那張圖層的名字，可以直接改
  function refreshCurName(){
    var el = $("curname");
    if (document.activeElement === el) return;      // 正在打字就別去動它
    var keys = Object.keys(S.selected);
    if (keys.length === 1 && S.byKey[keys[0]]){
      var node = nodeOf(keys[0]);
      el.disabled = false;
      el.value = node ? nameOf(node) : "";
      el.placeholder = "";
    } else {
      el.disabled = true;
      el.value = "";
      el.placeholder = keys.length > 1
        ? t("ph.curname.multi", { n:keys.length })
        : t("ph.curname");
    }
  }

  function commitCurName(){
    var el = $("curname");
    if (el.disabled) return;
    var keys = Object.keys(S.selected);
    if (keys.length !== 1) return;
    var node = nodeOf(keys[0]);
    if (!node) return;
    var v = el.value;
    if (!v.trim().length || v === nameOf(node)){ refreshCurName(); return; }
    pushHistory();
    writeName(node, v);
    render();
  }

  $("curname").addEventListener("keydown", function(ev){
    if (ev.isComposing || ev.keyCode === 229) return;   // 注音選字中的 Enter 不算
    if (ev.key === "Enter"){ ev.preventDefault(); commitCurName(); }
    else if (ev.key === "Escape"){ ev.preventDefault(); this.blur(); refreshCurName(); }
  });
  $("curname").addEventListener("blur", commitCurName);

  function esc(s){
    return String(s).replace(/[&<>]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];
    });
  }

  ["base","start","pad","dir","sep"].forEach(function(id){
    $(id).addEventListener("input", refreshSide);
    $(id).addEventListener("change", refreshSide);

  /* ---------- 按鈕 ---------- */

    var sel = orderedTargets();
    pushHistory();

  $("undo").addEventListener("click", function(){

    var h = S.history.pop();
    S.renames = h.renames;

      rebuild();

      render();
    }
  });

    S.renames = {};

  $("clearsel").addEventListener("click", function(){

  /* ---------- 空圖層 ---------- */

  // 背景產生預覽時已經檢查過每張圖層有沒有任何不透明的點
  function isEmptyLayer(layer){
    if (layer.special) return false;          // 色調補償、填色、智慧型物件、文字
    return layer.__empty === true;
  }

  // 資料夾裡的東西如果全被排除了，這個資料夾也算空的
  function markEmptyGroups(){
    var changed = true;
    while (changed){
      changed = false;
      S.all.forEach(function(n){
        if (!n.isGroup || S.deleted[n.key]) return;
        var kids = n.layer.children || [];
        var alive = kids.some(function(l){ return !S.deleted[l.__key]; });
        if (!alive){ S.deleted[n.key] = true; changed = true; }
      });
    }
  }

  $("scanEmpty").addEventListener("click", function(){
    if (!S.psd) return;
    if (!S.previewsDone){
      say("msg.scanWait", false);
      var btn = this;
      S.previews.then(function(){ btn.click(); });
      return;
    }
    $("busy").textContent = t("busy.scan");
    $("busy").classList.add("show");
    setTimeout(function(){
      var found = [];
      S.all.forEach(function(n){
        if (n.isGroup || S.deleted[n.key]) return;
        if (isEmptyLayer(n.layer)){ S.deleted[n.key] = true; found.push(n); }
      });
      if ($("emptyGroups").checked) markEmptyGroups();
      S.emptyList = S.all.filter(function(n){ return S.deleted[n.key]; });
      $("busy").classList.remove("show");
      requestComposite();
      render();
      if (found.length) say("msg.excluded", { n:S.emptyList.length }, false);
      else say("msg.noEmpty", false);
    }, 30);
  });

  $("restoreAll").addEventListener("click", function(){
    S.deleted = {};
    S.emptyList = [];
    requestComposite();
    render();
  });

  function renderEmptyPanel(){
    var box = $("emptybox");
    box.innerHTML = "";
    var list = S.all.filter(function(n){ return S.deleted[n.key]; });
    $("restoreAll").disabled = list.length === 0;
    if (!list.length){
      box.innerHTML = '<div class="dupok">' + esc(t("empty.none")) + '</div>';
      return;
    }
    list.forEach(function(n){
      var wrap = document.createElement("div");
      wrap.className = "emptyrow";
      var b = document.createElement("button");
      b.className = "p mono";
      b.textContent = (n.isGroup ? "\u25A3 " : "") + pathOf(n);
      b.title = b.textContent;
      b.addEventListener("click", function(){ navigateTo(n.key); });
      var r = document.createElement("button");
      r.className = "tiny";
      r.textContent = t("btn.restore");
      r.addEventListener("click", function(){
        delete S.deleted[n.key];
        // 還原一層時，它上面的資料夾也一起還原，不然會看不到
        n.ancestors.forEach(function(a){ delete S.deleted[a]; });
        requestComposite();
        render();
      });
      wrap.appendChild(b); wrap.appendChild(r);
      box.appendChild(wrap);
